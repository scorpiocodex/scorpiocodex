<title id="t">Technical stack</title>
<desc id="d">Languages: Python, JavaScript, SQL, HTML/CSS; Backend: FastAPI, Celery, Redis, PostgreSQL, SQLAlchemy, Alembic, REST APIs, JWT, asyncio, Node.js, Express; Frontend: React, Vite, Tailwind CSS; AI / LLM: LLM integration, Ollama, Llama 3.2, prompt engineering for structured data extraction; DevOps &amp; tools: pytest, mypy, Docker, GitHub Actions (CI/CD), Git, Linux, Vercel, Twilio API, Postman</desc>
